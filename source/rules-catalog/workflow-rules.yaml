rules:
  - id: WF-0001
    title: Trunk-based development with short-lived branches
    level: MUST
    owner: Engineering Management
    applied-to:
      languages: [ALL]
      frameworks: [ALL]
      types: [ALL]
    since: "0.1.0"
    description: Teams must use trunk-based development with branches lasting at most a few days.
    content: |
      The main branch is always deployable. Feature branches are created
      from main and merged back via pull request within 2-3 days maximum.
      Long-lived feature branches are prohibited. For large features, use
      feature flags to merge incomplete work safely. Release branches are
      only used for hotfixes to production.

  - id: WF-0002
    title: Conventional commit messages
    level: MUST
    owner: Platform Team
    applied-to:
      languages: [ALL]
      frameworks: [ALL]
      types: [ALL]
    since: "0.1.0"
    description: Commit messages must follow the Conventional Commits specification.
    content: |
      Format: <type>(<scope>): <description>
      Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore
      Examples:
      - feat(auth): add OAuth2 login flow
      - fix(orders): prevent duplicate charge on retry
      - docs(api): update endpoint descriptions
      The commit type drives automated changelog generation and semantic
      version bumps. Breaking changes use BREAKING CHANGE footer or !
      after the type.

  - id: WF-0003
    title: Pull requests require passing CI
    level: MUST
    owner: Platform Team
    applied-to:
      languages: [ALL]
      frameworks: [ALL]
      types: [ALL]
    since: "0.1.0"
    description: Pull requests cannot be merged until all CI checks pass.
    content: |
      Branch protection rules enforce:
      - All CI jobs must pass (lint, build, test, security scan)
      - At least one approval from a code owner
      - No direct pushes to main
      - Branches must be up-to-date with main before merge
      Force-merging past failed checks requires VP-level approval and
      an incident ticket.

  - id: WF-0004
    title: Squash merge for feature branches
    level: SHOULD
    owner: Platform Team
    applied-to:
      languages: [ALL]
      frameworks: [ALL]
      types: [ALL]
    since: "0.1.0"
    description: Feature branches should be squash-merged to keep main history clean.
    content: |
      Squash merge combines all feature branch commits into a single
      commit on main. The squash commit message should follow the
      conventional commit format and reference the PR number. This keeps
      git log on main clean and each commit deployable. Exceptions:
      merge commits are acceptable for branches with logically distinct
      changes that should be preserved.

  - id: WF-0005
    title: Automated deployment on merge to main
    level: MUST
    owner: Platform Team
    applied-to:
      languages: [ALL]
      frameworks: [ALL]
      types: [api, worker, batch, spa, ssr]
    since: "0.1.0"
    description: Merging to main must trigger automated deployment to the staging environment.
    content: |
      The CD pipeline:
      1. Build artifact (Docker image, bundle)
      2. Run smoke tests
      3. Deploy to staging automatically
      4. Deploy to production via manual approval or automated canary
      Rollback must be possible within 5 minutes. Failed deployments
      automatically roll back. Deployment status is posted to the team's
      communication channel.

  - id: WF-0006
    title: Infrastructure changes follow GitOps workflow
    level: MUST
    owner: Cloud Engineering
    applied-to:
      languages: [ALL]
      frameworks: [ALL]
      types: [iac]
    since: "0.1.0"
    description: All infrastructure changes must go through pull requests and automated apply.
    content: |
      Infrastructure-as-code workflow:
      1. Create branch with Terraform changes
      2. CI runs terraform plan and posts diff as PR comment
      3. Reviewer approves the plan
      4. Merge to main triggers terraform apply
      Manual terraform apply is prohibited except for break-glass
      emergencies, which require an incident ticket and post-mortem.
      State must be imported for any manual changes after the fact.

  - id: WF-0007
    title: Library releases follow publish workflow
    level: MUST
    owner: Platform Team
    applied-to:
      languages: [ALL]
      frameworks: [ALL]
      types: [library]
    since: "0.1.0"
    description: Shared libraries must be released via the automated publish pipeline.
    content: |
      Library release process:
      1. Version bump PR following semantic versioning
      2. CI runs full test suite including consumer contract tests
      3. Merge triggers build and publish to internal registry
      4. Changelog is generated from conventional commits
      Publishing directly from a developer machine is prohibited. Release
      candidates (-rc.N) are published for major versions and tested by
      consumer teams before the stable release.
